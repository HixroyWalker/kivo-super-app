name: Deploy to Google Play

on:
  push:
    branches:
      - main

jobs:
  deploy_android:
    name: Deploy to Google Play
    runs-on: ubuntu-latest
    
    defaults:
      run:
        working-directory: ./mobile

    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
      
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          
      - name: Generate Flutter Native Boilerplate & Force All Gradle Subprojects to compileSdk 36
        run: |
          flutter create . --org com.kivo.app
          flutter pub get
          find ~/.pub-cache -name "build.gradle" -exec sed -i 's/proguard-android.txt/proguard-android-optimize.txt/g' {} +
          python3 patch_android.py
        
      - name: Build Android App Bundle
        run: flutter build appbundle --release
        
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.0'
          bundler-cache: true
          working-directory: ./mobile/android
          
      - name: Create Google Play Service Account Key
        run: echo '${{ secrets.PLAY_STORE_CONFIG_JSON }}' > ./android/service-account.json
        
      - name: Create Android Keystore
        run: echo '${{ secrets.ANDROID_KEYSTORE_BASE64 }}' | base64 --decode > ./android/app/upload-keystore.jks
        
      - name: Deploy via Fastlane
        run: cd android && bundle exec fastlane beta || true
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
