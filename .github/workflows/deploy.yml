name: Deploy to TestFlight & Play Store

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'v*'

jobs:
  deploy_ios:
    name: Deploy to TestFlight
    runs-on: macos-latest
    
    defaults:
      run:
        working-directory: ./mobile

    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          
      - name: Generate Flutter Native Boilerplate & Inject Minimum iOS Target 14.0
        run: |
          flutter create . --org com.kivo.app
          flutter pub get
          if [ -f "ios/Podfile" ]; then
            python3 -c "
path = 'ios/Podfile'
with open(path, 'r') as f:
    content = f.read()
target_code = '''    target.build_configurations.each do |config|
      config.build_settings[\"IPHONEOS_DEPLOYMENT_TARGET\"] = \"14.0\"
    end'''
if 'flutter_additional_ios_build_settings(target)' in content:
    content = content.replace('flutter_additional_ios_build_settings(target)', 'flutter_additional_ios_build_settings(target)\n' + target_code)
with open(path, 'w') as f:
    f.write(content)
" || true
          fi
        
      - name: Build iOS IPA
        run: flutter build ipa --release --no-codesign
        
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.0'
          bundler-cache: true
          working-directory: ./mobile/ios
          
      - name: Deploy via Fastlane
        run: cd ios && bundle exec fastlane beta || true
        env:
          APP_STORE_CONNECT_API_KEY_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_KEY_ID }}
          APP_STORE_CONNECT_API_KEY_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY_KEY }}
          MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}

  deploy_android:
    name: Deploy to Google Play
    runs-on: ubuntu-latest
    
    defaults:
      run:
        working-directory: ./mobile

    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          
      - name: Generate Flutter Native Boilerplate & Clean AGP 8 Manifest & Set compileSdk 34
        run: |
          flutter create . --org com.kivo.app
          flutter pub get
          find ~/.pub-cache -name "build.gradle" -exec sed -i 's/proguard-android.txt/proguard-android-optimize.txt/g' {} +
          if [ -f "android/app/src/main/AndroidManifest.xml" ]; then
            sed -i 's/package="com.kivo.app"//g' android/app/src/main/AndroidManifest.xml || true
          fi
          if [ -f "android/app/build.gradle" ]; then
            sed -i 's/compileSdk = [0-9]*/compileSdk = 34/g' android/app/build.gradle || true
            sed -i 's/compileSdkVersion [0-9]*/compileSdkVersion 34/g' android/app/build.gradle || true
            sed -i 's/targetSdkVersion [0-9]*/targetSdkVersion 34/g' android/app/build.gradle || true
          fi
        
      - name: Build Android App Bundle
        run: flutter build appbundle --release
        
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.0'
          bundler-cache: true
          working-directory: ./mobile/android
          
      - name: Create Google Play Service Account Key
        run: echo '${{ secrets.PLAY_STORE_CONFIG_JSON }}' > ./android/service-account.json
        
      - name: Create Android Keystore
        run: echo '${{ secrets.ANDROID_KEYSTORE_BASE64 }}' | base64 --decode > ./android/app/upload-keystore.jks
        
      - name: Deploy via Fastlane
        run: cd android && bundle exec fastlane beta || true
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
