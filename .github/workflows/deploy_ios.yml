name: Deploy to TestFlight

on:
  push:
    branches:
      - main

jobs:
  deploy_ios:
    name: Deploy to TestFlight
    runs-on: macos-latest
    
    defaults:
      run:
        working-directory: ./mobile

    env:
      APP_STORE_CONNECT_API_KEY_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_KEY_ID }}
      APP_STORE_CONNECT_API_KEY_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ISSUER_ID }}
      APP_STORE_CONNECT_API_KEY_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY_KEY }}
      MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}
      MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      DEVELOPMENT_TEAM: ${{ secrets.APPLE_TEAM_ID }}
      IOS_CERTIFICATE_P12_BASE64: ${{ secrets.IOS_CERTIFICATE_P12_BASE64 }}
      IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          
      - name: Setup Workspace and Install CocoaPods
        run: |
          export FLUTTER_ROOT=$(dirname $(dirname $(which flutter)))
          flutter create . --org com.kivowebb.app
          flutter pub get
          python3 patch_ios.py
          cd ios
          if ! pod install; then
            echo "POD INSTALL FAILED. Capturing error log:"
            pod install --verbose 2>&1 | tail -n 80 > /tmp/pod_error.txt
            git config --global user.name "Antigravity CI"
            git config --global user.email "ci@gemini.app"
            git checkout -B ci-debug-log
            cp /tmp/pod_error.txt ../pod_error.txt
            git add ../pod_error.txt
            git commit -m "Capture Pod Install Error"
            git push -f origin ci-debug-log
            exit 1
          fi
        
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.0'
          bundler-cache: true
          working-directory: ./mobile/ios
          
      - name: Deploy via Fastlane
        run: cd ios && bundle exec fastlane beta
