workflows:
  flutter-ios-android-release:
    name: Kivo Super App Release Pipeline
    max_build_duration: 120
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - name: Generate Flutter Native Boilerplate & Config
        script: |
          cd mobile
          flutter create . --org com.kivo.app
          flutter pub get
      - name: Build Android App Bundle (AAB)
        script: |
          cd mobile
          flutter build appbundle --release
      - name: Build iOS App (IPA)
        script: |
          cd mobile
          if [ -f "/Users/builder/export_options.plist" ]; then
            flutter build ipa --release --export-options-plist=/Users/builder/export_options.plist
          else
            echo "Building un-signed IPA for distribution..."
            flutter build ipa --release --no-codesign
          fi
    artifacts:
      - mobile/build/app/outputs/bundle/release/*.aab
      - mobile/build/ios/ipa/*.ipa
      - mobile/build/ios/archive/Runner.xcarchive
