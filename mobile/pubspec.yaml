name: kivo
description: A closed-loop Super App for the Jamaican market.
publish_to: 'none'

version: 1.0.22+79

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  firebase_core: any
  firebase_auth: any
  cloud_firestore: any
  firebase_messaging: any
  google_sign_in: any
  sign_in_with_apple: any
  provider: ^6.1.2
  youtube_player_flutter: ^9.0.3
  cached_network_image: ^3.4.1
  fl_chart: ^0.69.0
  local_auth: any
  sqflite: any
  device_info_plus: any
  google_mobile_ads: any

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0

flutter:
  uses-material-design: true
