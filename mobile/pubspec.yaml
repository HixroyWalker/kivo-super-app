name: kivo
description: A closed-loop Super App for the Jamaican market.
publish_to: 'none'

version: 1.0.22+157

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  firebase_core: ^3.1.0
  firebase_auth: ^5.1.0
  cloud_firestore: ^5.0.0
  firebase_messaging: ^15.0.0
  google_sign_in: ^6.2.1
  sign_in_with_apple: ^6.1.1
  provider: ^6.1.1
  youtube_player_flutter: ^9.0.3
