  device_info_plus: ^9.1.1
  google_mobile_ads: ^5.1.0
  webview_flutter: ^4.7.0
  webview_flutter_wkwebview: ^3.13.0
  webview_flutter_android: ^3.15.0
  flutter_tts: ^4.2.2
  audioplayers: ^6.1.1
  image_picker: ^1.1.2
